<!DOCTYPE html>
<html>
<head>
<title>
background-demo
</title>
<style>
body{
background-image: url("likith.jpg");
background-attachment: fixed;
background-size: 100% 100%;
}
.div{
    display: flex;
    flex-direction: column;
    height: 500px;
    width: 400px;
    border: 1px solid black;
    align-items: center;
    margin: auto;
    margin-top: 25px;
    background:rgba(0, 0, 0, 0.5);
    box-shadow: inset -5px -5px rgba(0, 0, 0, 0.5);
    border-radius: 25px;
}
.div h1{
    color:white;
    font-size: 2rem;
    border-bottom: 4px solid rgba(255, 255, 255, 0.5);
    border-radius: 4px;
    margin: 50px;
}
.box{
    padding: 12px;
    margin: 20px;
    width: 65%;
    border: none;
    outline: none;
    border-radius: 50px;
    background-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset -3px -3px rgba(255, 255, 255, 0.5);
    color: white;
    font-size: 1rem;

}
#submit{
    padding: 10px 20px;
    margin-top: 50px;
    width:50%;
    background-color: rgba(0, 0, 0, 0.5);
    box-shadow: inset -3px -3px rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    outline: none;
    border-radius: 25px;
    font-size: 1rem;
}
#submit:hover{
    cursor: pointer;
    background-color: rgba(255, 255, 255, 0.5);
    color: white;
}
.placeholder{
color: white;
opacity: 0.7;
}
</style>
</head>
<body>
<div action="" class="div">
    <h1>login</h1>
<input type="text" class ="box" placeholder= "username"><br>
<input type="password" class ="box" placeholder = "password">
<input type="submit" value="login" id="submit">
</div>

</body>
</html>
